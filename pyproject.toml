[project]
name = "py-yfinance"
version = "0.1.18"
description = "A structured Python interface for retrieving and validating market data using yfinance"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Roman Medvedev", email = "pypi@romavm.dev" }
]
license = { text = "MIT" }
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",

    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "pycountry>=26.2.16",
    "pydantic-market-data>=0.4.0",
    "yfinance>=1.3.0",
    "pydantic-settings==2.14.1",
    "pytest==9.0.3",
]


[project.urls]
Homepage = "https://github.com/romamo/yfinance"
Repository = "https://github.com/romamo/yfinance"
Issues = "https://github.com/romamo/yfinance/issues"

[tool.uv]
dev-dependencies = [
    "ruff",
    "pytest",
    "mypy>=1.19.1",
    "bandit>=1.9.3",
    "pytest-cov>=7.0.0",
    "pandas-stubs",
]


[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I"]

[project.scripts]
yfinance = "py_yfinance.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/py_yfinance"]

[tool.hatch.build.targets.sdist]
include = [
    "/src/py_yfinance",
    "/tests",
    "/CHANGELOG.md",
    "/README.md",
    "/LICENSE",
]
exclude = [
    "/.agent",
    "/.github",
    "/uv.lock",
]



